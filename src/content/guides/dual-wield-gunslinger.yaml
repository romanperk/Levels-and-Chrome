      - { id: biomonitor, tier: 5, where: "Any ripperdoc", why: "Guides pair it with the Blood Pump for survivability" }
      - { id: cockatrice-optics, tier: 5, where: "Ripperdocs or Dogtown airdrops. Exact source unconfirmed", why: "The guides pick these optics for your face slot" }
      - { id: peripheral-inverse, tier: 5, where: "Ripperdocs or Dogtown airdrops. Exact source unconfirmed", why: "The guides pick this for your integumentary slot, though it uses a lot of capacity" }
      - { id: axolotl, tier: 5, where: "Finish all of Regina's gigs, or buy it from a Dogtown ripperdoc", why: "Lowers cyberware cooldowns after kills, so your Sandevistan comes back faster" }
